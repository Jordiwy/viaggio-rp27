name = "viatge"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "viatge-db"
database_id = "00000000-0000-0000-0000-000000000000" # lo rellena el despliegue automático
migrations_dir = "migrations"

[observability]
enabled = true
