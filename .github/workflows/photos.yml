name: Buscar fotos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/photo-candidates.mjs
      - name: Subir candidatas a la rama photo-candidates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan photo-candidates
          git rm -rfq .
          git add photo-candidates
          git commit -qm "Fotos candidatas"
          git push -f origin photo-candidates
