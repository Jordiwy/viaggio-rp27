name: Desplegar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y compilar
        run: |
          npm run typecheck
          npm run build

      - name: Faltan los secretos de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::Añade CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings → Secrets and variables → Actions."
          exit 1

      - name: Base de datos D1 (crearla si no existe)
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="viatge-db");process.stdout.write(d?(d.uuid||d.database_id||""):"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create viatge-db
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="viatge-db");process.stdout.write(d?(d.uuid||d.database_id||""):"")})')
          fi
          test -n "$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "Base de datos: viatge-db"

      - name: Aplicar migraciones
        run: npx wrangler d1 migrations apply viatge-db --remote

      - name: Publicar
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### La app está en $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que responde
        if: steps.deploy.outputs.url != ''
        run: |
          sleep 5
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health"
